name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libglfw3-dev libcurl4-openssl-dev \
            glslang-tools fonts-noto-cjk
      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.workflow }}
      - name: Build
        run: bazel build //...
      - name: Test
        run: bazel test //tests/...
      - name: Headless screenshots (lavapipe)
        run: ./tools/screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/*.png
